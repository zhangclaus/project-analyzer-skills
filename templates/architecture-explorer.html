<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT_TITLE — Architecture Explorer</title>
<style>
  :root {
    --bg: #0d1117;
    --sidebar-bg: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #484f58;
    --hover: #1f2937;
    --selected: #1c2333;
    --accent: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .toolbar h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .toolbar .subtitle { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .toolbar .spacer { flex: 1; }
  .search-box { position: relative; width: 240px; }
  .search-box input {
    width: 100%; padding: 6px 10px 6px 30px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.15); }
  .search-box::before {
    content: "\u26B2"; position: absolute; left: 9px; top: 50%;
    transform: translateY(-50%); color: var(--text-dim); font-size: 13px; pointer-events: none;
  }

  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Left sidebar - subsystem list */
  .sidebar {
    width: 280px; min-width: 240px; background: var(--sidebar-bg);
    border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0;
  }
  .subsystem { border-bottom: 1px solid var(--border); }
  .subsystem-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .subsystem-header:hover { background: var(--hover); }
  .subsystem-header.active { background: var(--selected); border-left: 3px solid var(--accent); }
  .subsystem-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .subsystem-info { flex: 1; min-width: 0; }
  .subsystem-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .subsystem-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
  .subsystem-count {
    font-size: 11px; color: var(--text-dim); background: var(--bg);
    padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
  }

  /* Resize handle */
  .resize-handle {
    width: 4px; cursor: col-resize; background: transparent; flex-shrink: 0;
  }
  .resize-handle:hover { background: var(--accent); }

  /* Right content */
  .content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .content-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--text-dim); font-size: 14px;
  }

  /* Subsystem overview */
  .subsystem-overview { margin-bottom: 28px; }
  .subsystem-overview h2 {
    font-size: 20px; font-weight: 600; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .subsystem-overview h2 .ov-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .subsystem-overview .ov-desc {
    font-size: 14px; color: var(--text-muted); line-height: 1.6; max-width: 640px;
  }

  /* Module cards */
  .module-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .module-card {
    background: var(--sidebar-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .module-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .module-card.selected { border-color: var(--accent); background: var(--selected); }
  .module-card .card-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .module-card .card-why { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .module-card .card-deps {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
  }
  .module-card .card-deps .dep-tag { color: var(--accent); }

  /* Module detail */
  .module-detail {
    background: var(--sidebar-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 28px;
    display: none;
  }
  .module-detail.visible { display: block; }
  .module-detail h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .module-detail .md-why {
    font-size: 13px; color: var(--text-muted); line-height: 1.6;
    margin-bottom: 16px; padding: 10px 14px; background: var(--bg); border-radius: 8px;
  }
  .module-detail .md-why strong { color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  .dep-section { margin-bottom: 16px; }
  .dep-section h4 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .dep-list { display: flex; flex-direction: column; gap: 6px; }
  .dep-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 12px; background: var(--bg); border-radius: 6px; font-size: 12px;
  }
  .dep-arrow { color: var(--accent); font-weight: 600; flex-shrink: 0; margin-top: 1px; }
  .dep-target { font-weight: 600; color: var(--text); flex-shrink: 0; cursor: pointer; }
  .dep-target:hover { text-decoration: underline; }
  .dep-reason { color: var(--text-muted); }

  /* Subsystem dependency graph */
  .subsystem-graph {
    background: var(--sidebar-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .subsystem-graph h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .graph-canvas {
    background: var(--bg); border-radius: 8px; padding: 20px;
    overflow-x: auto; display: flex; justify-content: center;
  }
  .graph-canvas svg text {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div class="toolbar">
  <h1>PROJECT_TITLE</h1>
  <span class="subtitle">DIAGRAM_TITLE</span>
  <div class="spacer"></div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索模块..." />
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="resize-handle" id="resizeHandle"></div>
  <div class="content" id="content">
    <div class="content-empty">从左侧选择子系统查看架构分析</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Graph data (replaced at build time) ──
  const GRAPH_DATA = /* GRAPH_DATA_PLACEHOLDER */ {subsystems:[],nodes:[],edges:[]};

  // ── Build indexes ──
  const nodeMap = {};
  const subsystemMap = {};
  const subsystemNodes = {}; // subsystemId -> [nodeIds]
  const downstream = {};
  const upstream = {};
  const edgeReasonMap = {};

  GRAPH_DATA.nodes.forEach(n => {
    nodeMap[n.id] = n;
    if (!subsystemNodes[n.subsystem]) subsystemNodes[n.subsystem] = [];
    subsystemNodes[n.subsystem].push(n.id);
    downstream[n.id] = [];
    upstream[n.id] = [];
  });
  GRAPH_DATA.subsystems.forEach(s => subsystemMap[s.id] = s);
  GRAPH_DATA.edges.forEach(e => {
    if (downstream[e.source]) downstream[e.source].push(e.target);
    if (upstream[e.target]) upstream[e.target].push(e.source);
    if (e.reason) edgeReasonMap[e.source + '->' + e.target] = e.reason;
  });

  // ── Compute subsystem-level edges ──
  function getSubsystemEdges() {
    const se = {}; // "a->b" -> { reasons: Set, count: n }
    GRAPH_DATA.edges.forEach(e => {
      const ns = nodeMap[e.source];
      const nt = nodeMap[e.target];
      if (!ns || !nt || ns.subsystem === nt.subsystem) return;
      const key = ns.subsystem + '->' + nt.subsystem;
      if (!se[key]) se[key] = { source: ns.subsystem, target: nt.subsystem, reasons: new Set(), count: 0 };
      se[key].count++;
      if (e.reason) se[key].reasons.add(e.reason);
    });
    return Object.values(se);
  }

  // ── Collect dependencies for a module ──
  function getModuleDeps(id) {
    const up = upstream[id].map(nid => ({
      id: nid, reason: edgeReasonMap[nid + '->' + id] || ''
    }));
    const down = downstream[id].map(nid => ({
      id: nid, reason: edgeReasonMap[id + '->' + nid] || ''
    }));
    return { up, down };
  }

  // ── Collect subsystem-level deps for a module ──
  function getModuleSubsystemDeps(id) {
    const n = nodeMap[id];
    if (!n) return { up: [], down: [] };
    const upSubs = new Set();
    const downSubs = new Set();
    upstream[id].forEach(nid => {
      const nn = nodeMap[nid];
      if (nn && nn.subsystem !== n.subsystem) upSubs.add(nn.subsystem);
    });
    downstream[id].forEach(nid => {
      const nn = nodeMap[nid];
      if (nn && nn.subsystem !== n.subsystem) downSubs.add(nn.subsystem);
    });
    return {
      up: [...upSubs].map(sid => subsystemMap[sid]).filter(Boolean),
      down: [...downSubs].map(sid => subsystemMap[sid]).filter(Boolean)
    };
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Sidebar ──
  const sidebarEl = document.getElementById('sidebar');
  const contentEl = document.getElementById('content');
  let activeSubsystemId = null;
  let activeModuleId = null;

  function buildSidebar() {
    sidebarEl.innerHTML = '';
    GRAPH_DATA.subsystems.forEach(s => {
      const count = (subsystemNodes[s.id] || []).length;
      const div = document.createElement('div');
      div.className = 'subsystem';
      div.innerHTML = `
        <div class="subsystem-header" data-id="${escHtml(s.id)}">
          <div class="subsystem-icon" style="background:${s.color}22;color:${s.color}">${escHtml(s.icon)}</div>
          <div class="subsystem-info">
            <div class="subsystem-name">${escHtml(s.name)}</div>
            <div class="subsystem-desc">${escHtml(s.desc)}</div>
          </div>
          <div class="subsystem-count">${count}</div>
        </div>
      `;
      div.querySelector('.subsystem-header').addEventListener('click', () => selectSubsystem(s.id));
      sidebarEl.appendChild(div);
    });
  }

  // ── Select subsystem ──
  function selectSubsystem(id) {
    activeSubsystemId = id;
    activeModuleId = null;
    // Update sidebar active state
    document.querySelectorAll('.subsystem-header').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });
    renderSubsystemContent(id);
  }

  // ── Render subsystem content ──
  function renderSubsystemContent(subsystemId) {
    const s = subsystemMap[subsystemId];
    if (!s) return;
    const moduleIds = subsystemNodes[subsystemId] || [];

    let html = '';

    // Overview
    html += `<div class="subsystem-overview">`;
    html += `<h2><span class="ov-icon" style="background:${s.color}22;color:${s.color}">${escHtml(s.icon)}</span> ${escHtml(s.name)}</h2>`;
    html += `<div class="ov-desc">${escHtml(s.desc)}</div>`;
    html += `</div>`;

    // Module cards
    html += `<div class="module-cards">`;
    moduleIds.forEach(mid => {
      const n = nodeMap[mid];
      if (!n) return;
      const subsDeps = getModuleSubsystemDeps(mid);
      const depTags = [];
      subsDeps.up.forEach(s2 => depTags.push('← ' + s2.name));
      subsDeps.down.forEach(s2 => depTags.push('→ ' + s2.name));

      html += `<div class="module-card" data-id="${escHtml(mid)}">`;
      html += `<div class="card-name">${escHtml(n.name)}</div>`;
      html += `<div class="card-why">${escHtml(n.why)}</div>`;
      if (depTags.length > 0) {
        html += `<div class="card-deps">${depTags.map(t => '<span class="dep-tag">' + escHtml(t) + '</span>').join(' &nbsp;')}</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;

    // Module detail placeholder
    html += `<div class="module-detail" id="moduleDetail"></div>`;

    // Subsystem dependency graph
    const subEdges = getSubsystemEdges().filter(e => e.source === subsystemId || e.target === subsystemId);
    if (subEdges.length > 0) {
      html += renderSubsystemGraph(subsystemId, subEdges);
    }

    contentEl.innerHTML = html;

    // Bind card clicks
    contentEl.querySelectorAll('.module-card').forEach(card => {
      card.addEventListener('click', () => selectModule(card.dataset.id));
    });
  }

  // ── Select module ──
  function selectModule(id) {
    activeModuleId = id;
    const n = nodeMap[id];
    if (!n) return;

    // Highlight card
    contentEl.querySelectorAll('.module-card').forEach(card => {
      card.classList.toggle('selected', card.dataset.id === id);
    });

    const detailEl = document.getElementById('moduleDetail');
    if (!detailEl) return;

    const deps = getModuleDeps(id);
    const subsDeps = getModuleSubsystemDeps(id);

    let html = '';
    html += `<h3>${escHtml(n.name)}</h3>`;
    html += `<div class="md-why"><strong>WHY</strong>${escHtml(n.why)}</div>`;

    // Upstream deps (who depends on this)
    if (deps.up.length > 0) {
      html += `<div class="dep-section"><h4>上游依赖 — 谁依赖 ${escHtml(n.name)}</h4><div class="dep-list">`;
      deps.up.forEach(d => {
        const tn = nodeMap[d.id];
        const tName = tn ? tn.name : d.id;
        html += `<div class="dep-item"><span class="dep-arrow">←</span><span class="dep-target" data-id="${escHtml(d.id)}">${escHtml(tName)}</span><span class="dep-reason">${escHtml(d.reason)}</span></div>`;
      });
      html += `</div></div>`;
    }

    // Downstream deps (what this depends on)
    if (deps.down.length > 0) {
      html += `<div class="dep-section"><h4>下游依赖 — ${escHtml(n.name)} 依赖什么</h4><div class="dep-list">`;
      deps.down.forEach(d => {
        const tn = nodeMap[d.id];
        const tName = tn ? tn.name : d.id;
        html += `<div class="dep-item"><span class="dep-arrow">→</span><span class="dep-target" data-id="${escHtml(d.id)}">${escHtml(tName)}</span><span class="dep-reason">${escHtml(d.reason)}</span></div>`;
      });
      html += `</div></div>`;
    }

    if (deps.up.length === 0 && deps.down.length === 0) {
      html += `<div style="color:var(--text-dim);font-size:13px;">无直接依赖关系</div>`;
    }

    detailEl.innerHTML = html;
    detailEl.classList.add('visible');
    detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Bind dep target clicks
    detailEl.querySelectorAll('.dep-target').forEach(el => {
      el.addEventListener('click', () => {
        const targetId = el.dataset.id;
        const targetNode = nodeMap[targetId];
        if (targetNode && targetNode.subsystem !== activeSubsystemId) {
          selectSubsystem(targetNode.subsystem);
          setTimeout(() => selectModule(targetId), 100);
        } else {
          selectModule(targetId);
        }
      });
    });
  }

  // ── Render subsystem dependency graph ──
  function renderSubsystemGraph(centerId, edges) {
    // Collect all involved subsystems
    const involved = new Set([centerId]);
    edges.forEach(e => { involved.add(e.source); involved.add(e.target); });
    const subs = [...involved].map(id => subsystemMap[id]).filter(Boolean);

    // Layout: center at top, others below
    const nodeW = 140;
    const nodeH = 44;
    const padX = 30;
    const padY = 30;
    const cols = Math.min(subs.length, 4);
    const rows = Math.ceil(subs.length / cols);
    const svgW = cols * (nodeW + padX) + padX;
    const svgH = rows * (nodeH + padY) + padY + 40;

    const positions = {};
    subs.forEach((s, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      positions[s.id] = {
        x: padX + col * (nodeW + padX) + nodeW / 2,
        y: (s.id === centerId ? 20 : 80) + row * (nodeH + padY) + nodeH / 2
      };
    });

    let svg = `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<defs><marker id="sg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">`;
    svg += `<path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>`;

    // Edges
    edges.forEach(e => {
      const from = positions[e.source];
      const to = positions[e.target];
      if (!from || !to) return;
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) return;
      const nx = dx / dist;
      const ny = dy / dist;
      const x1 = from.x + nx * (nodeW / 2 + 4);
      const y1 = from.y + ny * (nodeH / 2 + 4);
      const x2 = to.x - nx * (nodeW / 2 + 4);
      const y2 = to.y - ny * (nodeH / 2 + 4);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#30363d" stroke-width="1.5" marker-end="url(#sg-arrow)"/>`;
      // Reason label
      const reasons = [...e.reasons];
      if (reasons.length > 0) {
        const label = reasons[0].length > 30 ? reasons[0].substring(0, 29) + '…' : reasons[0];
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2 - 6;
        svg += `<text x="${mx}" y="${my}" text-anchor="middle" fill="#8b949e" font-size="9">${escHtml(label)}</text>`;
      }
    });

    // Nodes
    subs.forEach(s => {
      const pos = positions[s.id];
      if (!pos) return;
      const isCenter = s.id === centerId;
      const strokeColor = isCenter ? '#58a6ff' : s.color;
      const strokeWidth = isCenter ? 2 : 1.5;
      svg += `<rect x="${pos.x - nodeW/2}" y="${pos.y - nodeH/2}" width="${nodeW}" height="${nodeH}" rx="8" fill="${isCenter ? '#1c2333' : '#161b22'}" stroke="${strokeColor}" stroke-width="${strokeWidth}"/>`;
      svg += `<text x="${pos.x}" y="${pos.y + 1}" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="${isCenter ? '600' : '400'}">${escHtml(s.icon + ' ' + s.name)}</text>`;
    });

    svg += '</svg>';

    return `<div class="subsystem-graph"><h3>子系统关系</h3><div class="graph-canvas">${svg}</div></div>`;
  }

  // ── Search ──
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) {
      // Reset sidebar
      document.querySelectorAll('.subsystem').forEach(el => el.style.display = '');
      return;
    }
    // Show/hide subsystems based on module name match
    GRAPH_DATA.subsystems.forEach(s => {
      const moduleIds = subsystemNodes[s.id] || [];
      const hasMatch = moduleIds.some(mid => {
        const n = nodeMap[mid];
        return n && (
          n.name.toLowerCase().includes(q) ||
          n.why.toLowerCase().includes(q) ||
          mid.toLowerCase().includes(q)
        );
      });
      const el = sidebarEl.querySelector(`.subsystem-header[data-id="${s.id}"]`);
      if (el) el.closest('.subsystem').style.display = hasMatch ? '' : 'none';
    });
  });

  // ── Resize handle ──
  const resizeHandle = document.getElementById('resizeHandle');
  let resizing = false;
  resizeHandle.addEventListener('mousedown', (e) => { resizing = true; e.preventDefault(); });
  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const newWidth = Math.max(220, Math.min(500, e.clientX));
    sidebarEl.style.width = newWidth + 'px';
  });
  document.addEventListener('mouseup', () => { resizing = false; });

  // ── Init ──
  buildSidebar();

})();
</script>
</body>
</html>
